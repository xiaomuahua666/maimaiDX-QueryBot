name: Notify PR

# fork PR 也能收到飞书通知：使用 pull_request_target 在 base 仓库上下文中运行，
# 因此可以访问仓库 secrets。安全约束：
#   1. 显式 checkout base 分支（不 checkout PR head），不执行 fork 提交的代码；
#   2. persist-credentials: false；
#   3. 通知脚本只用标准库读取事件 payload，不 import/运行仓库业务代码。
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - closed
      - synchronize
      - ready_for_review
      - review_requested

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Send Feishu card
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: python scripts/feishu_push_notify.py
