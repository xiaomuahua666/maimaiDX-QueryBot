name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: pip install ruff pyyaml

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Check shell scripts syntax
        run: bash -n scripts/*.sh

      - name: Validate YAML workflows
        run: |
          python - <<'PY'
          import glob, sys, yaml
          failed = False
          for path in glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml'):
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      yaml.safe_load(f)
                  print(f'OK  {path}')
              except yaml.YAMLError as exc:
                  failed = True
                  print(f'BAD {path}: {exc}')
          sys.exit(1 if failed else 0)
          PY

      - name: Validate JSON data files
        run: |
          python - <<'PY'
          import glob, json, sys
          targets = []
          for pattern in ('static/**/*.json', 'data/**/*.json', 'libraries/**/*.json', '*.json'):
              targets.extend(glob.glob(pattern, recursive=True))
          targets = sorted(set(targets))
          failed = 0
          for path in targets:
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      json.load(f)
              except Exception as exc:
                  failed += 1
                  print(f'BAD {path}: {exc}')
          print(f'Validated {len(targets)} JSON files, {failed} failed')
          sys.exit(1 if failed else 0)
          PY

      - name: Ruff lint check
        run: ruff check .

  list-tests:
    name: Discover tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: discover
        name: Build test matrix
        run: |
          python - <<'PY'
          import glob, json, os
          skip = {
              "test_account_machine_flow.py",
              "test_awmcnet_integration.py",
              "test_fit_b50_rating_consistency.py",
              "test_guess_rating_impostor.py",
              "test_qq_admin_guess_identity.py",
              "test_qq_break_expiry_routing.py",
              "test_qq_break_identity.py",
              "test_qq_command_dispatch.py",
              "test_qq_command_matching.py",
              "test_qq_direct_send_routing.py",
              "test_qq_guess_active_delivery.py",
              "test_qq_guess_legacy_mapping.py",
              "test_qq_guess_rating_candidates.py",
              "test_qq_image_reply.py",
              "test_qq_media_mention.py",
              "test_qq_score_report_billing.py",
              "test_qrcode_image.py",
              "test_render_tasks.py",
              "test_ticket_queue_flow.py",
          }
          files = sorted(
              os.path.basename(p)
              for p in glob.glob('scripts/test_*.py')
              if os.path.basename(p) not in skip
          )
          matrix = {"include": [{"test_file": f} for f in files]}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          print(f'Discovered {len(files)} tests')
          PY

  test:
    name: ${{ matrix.test_file }}
    needs: list-tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.list-tests.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dependencies
        run: pip install -e .

      - name: Run ${{ matrix.test_file }}
        run: python scripts/${{ matrix.test_file }}
